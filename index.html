1939 góp phần rèn luyện lực lượng nào?',['Lực lượng chính trị quần chúng','Quân đội Nhật','Thực dân Pháp','Quân đội Đức'],0],['Phong trào dân chủ kết hợp những hình thức đấu tranh nào?',['Hợp pháp, nửa hợp pháp và bí mật','Chỉ vũ trang','Chỉ ngoại giao','Chỉ bí mật'],0],['Phong trào dân chủ kết thúc vào năm nào?',['1931','1935','1939','1945'],2]],9:[['Lực lượng giữ vai trò lãnh đạo Cách mạng tháng Tám là ai?',['Đảng Cộng sản Đông Dương','Việt Nam Quốc dân đảng','Chính phủ Pháp','Quân đội Nhật'],0],['Hội nghị toàn quốc của Đảng tại Tân Trào diễn ra vào tháng nào?',['Tháng 3','Tháng 5','Tháng 8','Tháng 12'],2],['Khởi nghĩa giành chính quyền ở Huế thắng lợi ngày nào?',['19/8/1945','23/8/1945','25/8/1945','2/9/1945'],1],['Khởi nghĩa giành chính quyền ở Sài Gòn thắng lợi ngày nào?',['19/8/1945','23/8/1945','25/8/1945','30/8/1945'],2]],10:[['Trật tự thế giới hình thành sau Chiến tranh thế giới thứ hai thường được gọi là gì?',['Trật tự hai cực Ianta','Trật tự Versailles','Trật tự đơn cực','Trật tự Đông Dương'],0],['NATO là tổ chức nào?',['Tổ chức Hiệp ước Bắc Đại Tây Dương','Hiệp hội Đông Nam Á','Liên minh châu Âu','Tổ chức Y tế thế giới'],0],['Vác-sa-va ra đời trong bối cảnh nào?',['Đối đầu Đông–Tây','Hội nhập ASEAN','Chiến tranh thế giới thứ nhất','Khủng hoảng dầu mỏ'],0],['Chiến tranh lạnh chấm dứt vào năm nào?',['1975','1986','1991','2001'],2]],11:[['Hiệp định Sơ bộ Việt–Pháp được ký vào năm nào?',['1945','1946','1947','1950'],1],['Chiến dịch Biên giới Thu–Đông diễn ra năm nào?',['1947','1950','1951','1954'],1],['Chiến dịch Việt Bắc Thu–Đông diễn ra năm nào?',['1946','1947','1950','1954'],1],['Đường lối kháng chiến chống Pháp là gì?',['Toàn dân, toàn diện, trường kỳ, tự lực cánh sinh','Chỉ dựa vào nước ngoài','Chỉ ngoại giao','Đánh nhanh thắng nhanh'],0]],12:[['Hiệp định Paris về Việt Nam được ký vào năm nào?',['1968','1970','1973','1975'],2],['Phong trào Đồng khởi bùng nổ mạnh ở Bến Tre vào năm nào?',['1954','1956','1960','1965'],2],['Tổng tiến công và nổi dậy Tết Mậu Thân diễn ra năm nào?',['1965','1968','1972','1975'],1],['Chiến dịch Tây Nguyên mở màn cho Tổng tiến công năm 1975 vào tháng nào?',['3/1975','4/1975','5/1975','6/1975'],0]],13:[['Việt Nam thống nhất về mặt nhà nước vào năm nào?',['1975','1976','1980','1986'],1],['Một khó khăn lớn sau 1975 là gì?',['Hậu quả chiến tranh và khủng hoảng kinh tế–xã hội','Thiếu dân số','Không có lãnh thổ','Không có quan hệ quốc tế'],0],['Công cuộc Đổi mới được bắt đầu từ năm nào?',['1976','1980','1986','1991'],2],['Đổi mới trước hết tập trung vào lĩnh vực nào?',['Kinh tế','Thể thao','Quân sự','Du lịch'],0]],14:[['Việt Nam bình thường hóa quan hệ với Hoa Kỳ vào năm nào?',['1991','1995','2000','2007'],1],['Việt Nam gia nhập WTO là bước tiến quan trọng trong quá trình nào?',['Hội nhập kinh tế quốc tế','Đóng cửa nền kinh tế','Tái lập thuộc địa','Chấm dứt ngoại giao'],0],['Việt Nam đăng cai APEC năm 2006 và 2017 thể hiện điều gì?',['Vai trò hội nhập quốc tế ngày càng tăng','Rút khỏi khu vực','Không tham gia ngoại giao','Đóng cửa kinh tế'],0],['Một thành tựu nổi bật của Đổi mới là gì?',['Kinh tế tăng trưởng và đời sống nhân dân được cải thiện','Xóa bỏ giáo dục','Giảm giao thương','Ngừng công nghiệp hóa'],0]]};data.lessons.forEach(x=>{if(extraQuestions[x.id])x.quiz=[...x.quiz,...extraQuestions[x.id]]});
function save(){localStorage.setItem('ls9data',JSON.stringify(data));toast('Đã lưu thay đổi trên trình duyệt');}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}
function renderNav(){let q=$('#search').value.toLowerCase();let groups={};data.lessons.filter(x=>(x.title+x.ch+x.tag).toLowerCase().includes(q)).forEach(x=>(groups[x.ch]??=[]).push(x));$('#nav').innerHTML=Object.entries(groups).map(([ch,arr])=>`<div class="chapter">${esc(ch)}</div>`+arr.map(x=>`<button class="lesson ${x.id===current?'active':''}" onclick="openLesson(${x.id})"><b>${esc(x.tag)}</b> ${esc(x.title)}<small>${esc(x.summary.slice(0,70))}…</small></button>`).join('')).join('')||'<div class="empty">Không tìm thấy bài.</div>'}
function openLesson(id){current=id;editing=false;answered=0;total=0;renderNav();renderContent();requestAnimationFrame(()=>{$('#content').scrollIntoView({behavior:'smooth',block:'start'})})}
function renderContent(){let x=data.lessons.find(a=>a.id===current)||data.lessons[0];$('#content').innerHTML=`<div class="hero"><div class="eyebrow">${esc(x.ch)} · ${esc(x.tag)}</div><h2>${esc(x.title)}</h2><p class="sub">${esc(x.summary)}</p><div class="chips"><span class="chip">📌 Ghi nhớ</span><span class="chip">🧠 Luyện tập</span><span class="chip">✎ Nội dung chỉnh sửa</span></div></div><div class="grid"><div class="card"><h3>Kiến thức trọng tâm</h3><p>${esc(x.summary)}</p><div class="note"><b>Mẹo học:</b> Tách bài thành 3 lớp: <b>nguyên nhân → diễn biến → kết quả/ý nghĩa</b>. Tự kể lại bằng lời của bạn thay vì học thuộc từng câu.</div></div><div class="card"><h3>Dòng thời gian</h3><div class="timeline">${x.events.length?x.events.map(e=>`<div class="event"><div class="year">${esc(e[0])}</div><div>${esc(e[1])}</div></div>`).join(''):'<div class="empty">Chưa có dữ liệu dòng thời gian. Hãy bật “Chỉnh sửa” để thêm.</div>'}</div></div></div><div class="card quiz" style="margin-top:14px"><h3>Trắc nghiệm nhanh</h3>${x.quiz.length?x.quiz.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<button class="option" onclick="answer(this,${j},${q[2]})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div class="answer sub" style="display:none;margin-top:8px">✓ Câu trả lời đúng: <b>${esc(q[1][q[2]])}</b></div></div>`).join(''):'<div class="empty">Chưa có câu hỏi cho bài này. Bạn có thể tự thêm trong chế độ chỉnh sửa.</div>'}<div id="score" class="score"></div></div><div class="editor ${editing?'on':''}"><div class="card"><h3>✎ Trình chỉnh sửa bài học</h3><label>Tên bài</label><input id="edTitle" value="${esc(x.title)}"><label>Tóm tắt</label><textarea id="edSummary">${esc(x.summary)}</textarea><label>Dòng thời gian — mỗi dòng: NĂM | NỘI DUNG</label><textarea id="edEvents">${esc(x.events.map(e=>e.join(' | ')).join('\n'))}</textarea><button class="btn primary" onclick="applyEdit()">Lưu bài này</button></div></div>`}
function showFullTimeline(){let events=[];data.lessons.forEach(x=>x.events.forEach(e=>events.push({year:e[0],text:e[1],lesson:x.tag+' · '+x.title})));$('#content').innerHTML=`<div class="hero"><div class="eyebrow">Ôn tập toàn khóa</div><h2>Dòng thời gian lịch sử</h2><p class="sub">Các mốc tiêu biểu được tổng hợp từ những bài đã có dữ liệu.</p></div><div class="card"><div class="timeline">${events.length?events.map(e=>`<div class="event"><div class="year">${esc(e.year)}</div><div><b>${esc(e.text)}</b><div class="sub" style="margin-top:4px">${esc(e.lesson)}</div></div></div>`).join(''):'<div class="empty">Chưa có mốc thời gian. Hãy thêm dữ liệu trong chế độ chỉnh sửa.</div>'}</div></div>`}
function showFullQuiz(){let qs=[];data.lessons.forEach(x=>x.quiz.forEach(q=>qs.push({q:q[0],o:q[1],a:q[2],lesson:x.tag})));answered=0;total=0;$('#content').innerHTML=`<div class="hero"><div class="eyebrow">Luyện tập toàn khóa</div><h2>Trắc nghiệm tổng hợp</h2><p class="sub">Làm các câu hỏi có sẵn trong dữ liệu bài học. Đáp án đúng sẽ hiện ngay sau khi bạn chọn.</p></div><div class="card quiz">${qs.length?qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b><div class="sub" style="margin:5px 0">${esc(q.lesson)}</div>${q.o.map((o,j)=>`<button class="option" onclick="answer(this,${j},${q.a})">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}<div class="answer sub" style="display:none;margin-top:8px">✓ Câu trả lời đúng: <b>${esc(q.o[q.a])}</b></div></div>`).join(''):'<div class="empty">Chưa có câu hỏi tổng hợp.</div>'}<div id="score" class="score"></div></div>`}
let answered=0,total=0;function answer(btn,j,correct){let q=btn.parentElement;q.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(j===correct?'correct':'wrong');let answer=q.querySelector('.answer');if(answer)answer.style.display='block';if(j===correct)answered++;total++;$('#score').textContent=`Điểm tạm thời: ${answered}/${total}`}
function applyEdit(){let x=data.lessons.find(a=>a.id===current);x.title=$('#edTitle').value;x.summary=$('#edSummary').value;x.events=$('#edEvents').value.split('\n').filter(Boolean).map(s=>{let [a,...b]=s.split('|');return[a.trim(),b.join('|').trim()]});save();renderNav();renderContent();}
$('#editBtn').onclick=()=>{editing=!editing;$('#editBtn').textContent=editing?'✓ Đang chỉnh sửa':'✎ Chỉnh sửa';renderContent()};$('#resetBtn').onclick=()=>{if(confirm('Khôi phục toàn bộ dữ liệu mẫu?')){data=structuredClone(initial);save();openLesson(1)}};$('#search').oninput=renderNav;
renderNav();renderContent();
</script></body></html>
